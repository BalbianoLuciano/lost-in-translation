[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
# Sólo lectura, y sólo los fixtures: el test cruzado lee el voucher que firmó Go.
fs_permissions = [{access = "read", path = "./test/fixtures"}]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 32
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
