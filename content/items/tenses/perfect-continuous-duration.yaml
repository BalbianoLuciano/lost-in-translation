skill: tense.perfect_continuous.duration
items:
  - id: pp-cont-01
    type: cloze
    difficulty: 1
    placement: true
    context: 'Standup.'
    text: I ___ (debug) this memory leak since yesterday morning, and I think I'm close.
    answers: [have been debugging, "'ve been debugging"]
    rule: 'Present perfect continuous for an activity that started in the past and is still going on.'
    explain_es:
      rule: 'Have been + -ing cuenta una actividad que empezó antes y sigue en curso.'
      analogy: 'Es la barra de progreso de una descarga: arrancó hace rato y todavía no llegó al 100%.'
      why: '"Since yesterday morning" marca el inicio y "I think I''m close" dice que todavía no terminaste. Esa combinación pide "have been debugging".'

  - id: pp-cont-02
    type: choice
    difficulty: 2
    placement: true
    context: 'One-on-one with a new team member.'
    text: How long ___ on the payments integration?
    options: [have you been working, are you working, do you work]
    answer: 0
    rule: '"How long have you been + -ing?" asks about the duration of something still in progress.'
    explain_es:
      rule: 'Para preguntar cuánto hace que alguien viene haciendo algo, va "How long have you been + -ing?".'
      analogy: 'Es preguntarle a alguien cuántos kilómetros lleva corriendo, no si corre.'
      why: '"How long are you working" y "how long do you work" son calcos de "¿cuánto hace que trabajás?". En inglés la duración hasta ahora necesita el perfect continuous.'

  - id: pp-cont-03
    type: explain_why
    difficulty: 3
    placement: true
    context: 'Code review, explaining the state of a branch.'
    text: I've been refactoring the auth module all morning, so the tests are a bit messy.
    focus: I've been refactoring
    question: Why "have been refactoring" and not "have refactored"?
    options:
      - It focuses on the activity and how long it went on, which explains the current mess.
      - It means the refactor is completely finished and the branch is ready to merge.
      - It is the past simple of "refactor", used because the morning is already over.
      - It points to something that will happen later today, once the tests are fixed.
    answer: 0
    rule: 'Perfect continuous focuses on the activity and its duration; present perfect focuses on the finished result.'
    explain_es:
      rule: 'El perfect continuous pone el foco en la actividad y su duración, y explica efectos visibles ahora. El present perfect simple pone el foco en el resultado terminado.'
      analogy: 'Es la diferencia entre "estuve pintando" (tenés las manos manchadas) y "pinté la pared" (la pared está terminada).'
      why: 'El desorden en los tests es la huella de la actividad en curso. "Have refactored" diría que el refactor está listo. No es pasado simple ni futuro.'

  - id: pp-cont-04
    type: fix_error
    difficulty: 2
    placement: false
    context: 'Status email.'
    text: We are waiting for the client's feedback for two weeks now.
    wrong: are
    corrections: [have been, "'ve been"]
    rule: 'Duration up to now ("for two weeks") needs present perfect continuous, not present continuous.'
    explain_es:
      rule: 'Si decís cuánto tiempo lleva algo hasta ahora ("for two weeks"), va have been + -ing.'
      analogy: 'El presente continuo es una foto de ahora; con "for two weeks" necesitás el video entero desde que arrancó.'
      why: 'Cambiando "are" por "have been" queda "we have been waiting... for two weeks", que conecta el inicio con hoy.'

  - id: pp-cont-05
    type: cloze
    difficulty: 1
    placement: false
    context: Slack to a teammate.
    text: My eyes hurt — I ___ (stare) at these logs for two hours.
    answers: [have been staring, "'ve been staring"]
    rule: Present perfect continuous for an activity that has been running up to now and explains what you feel or see.
    explain_es:
      rule: Have been + -ing cuenta una actividad que viene corriendo hasta ahora y explica lo que se ve o se siente en este momento.
      analogy: Es la huella de la actividad, no el resultado. Los ojos rojos son la marca de las dos horas de logs.
      why: '"For two hours" da la duración y los ojos doloridos son la consecuencia de ahora. Por eso va "have been staring" y no "stared".'

  - id: pp-cont-06
    type: choice
    difficulty: 2
    placement: false
    context: One-on-one about onboarding.
    text: She ___ the new dashboard for two weeks and still finds it confusing.
    options: [has been using, is using, uses]
    answer: 0
    rule: A stretch of time up to now ("for two weeks") needs have been + -ing, not the present.
    explain_es:
      rule: Si decís cuánto tiempo lleva algo hasta hoy, va has been + -ing. El presente simple o continuo no llega hasta atrás.
      analogy: El presente es una foto de este segundo. Acá necesitás el video desde que arrancó hace dos semanas.
      why: '"Is using" y "uses" son el calco de "usa el dashboard hace dos semanas". En inglés esa línea de tiempo la arma "has been using".'

  - id: pp-cont-07
    type: explain_why
    difficulty: 2
    placement: false
    context: Incident channel.
    text: The queue has been growing since 3 p.m., so the workers can't keep up.
    focus: has been growing
    question: Why "has been growing" and not "has grown"?
    options:
      - It points at an activity still running, which is what explains the problem.
      - It means the queue reached its final size and stopped growing at 3 p.m.
      - It is the polite form, the one you use to report someone else's bug.
      - It marks a habit that repeats every day around the same hour, at 3 p.m.
    answer: 0
    rule: The continuous points at the activity still in progress; the simple perfect points at a finished result.
    explain_es:
      rule: El continuo apunta a la actividad todavía en curso; el perfecto simple apunta a un resultado ya cerrado.
      analogy: Es "la pava está hirviendo" contra "la pava hirvió". Con el continuo, el problema sigue pasando mientras hablás.
      why: Si los workers no dan abasto, la cola sigue creciendo. "Has grown" diría que ya llegó a su tamaño final y se quedó ahí.

  - id: pp-cont-08
    type: fix_error
    difficulty: 2
    placement: false
    context: Email to the client.
    text: Our team is working on your migration since the kickoff in March.
    wrong: is
    corrections: [has been, "'s been"]
    rule: With "since", the present continuous does not reach back far enough; use has been + -ing.
    explain_es:
      rule: Con "since" no alcanza el presente continuo, porque no conecta con el pasado. Va has been + -ing.
      analogy: '"Is working" es lo que pasa ahora mismo; "since March" pide una línea que arranque en marzo y llegue hasta hoy.'
      why: Cambiando "is" por "has been" queda "Our team has been working on your migration since the kickoff", que es lo que querés decirle al cliente.

  - id: pp-cont-09
    type: cloze
    difficulty: 2
    placement: false
    context: Incident channel.
    text: We've been ___ (get) timeouts from the provider since the deploy.
    answers: [getting]
    rule: After have been, the verb takes the -ing form.
    explain_es:
      rule: Después de have been siempre va el verbo con -ing. Esa es toda la forma.
      analogy: Son tres piezas fijas que encajan siempre igual, como un import que no cambia.
      why: '"Get" queda en "getting", con doble t porque es una sílaba con vocal corta entre consonantes. La regla está en el glosario.'

  - id: pp-cont-10
    type: choice
    difficulty: 3
    placement: false
    context: Client call, raising a risk.
    text: We ___ your feedback since Tuesday, so the sprint is at risk.
    options: [have been waiting for, are waiting for, waited for]
    answer: 0
    rule: '"Since Tuesday" opens a line that reaches today, so the verb needs have been + -ing.'
    explain_es:
      rule: '"Since Tuesday" abre una línea que llega hasta hoy, y eso pide have been + -ing.'
      analogy: Es la diferencia entre "estoy esperando" y "vengo esperando desde el martes". Con la duración adentro, el reclamo pesa.
      why: '"Are waiting" se queda en el ahora y "waited" cierra la espera, como si ya te hubieran contestado. Ninguna de las dos transmite el riesgo.'

  - id: pp-cont-11
    type: explain_why
    difficulty: 3
    placement: false
    context: Standup.
    text: I've been reading the provider's docs, so I can explain the flow now.
    focus: I've been reading
    question: Why the continuous, if the reading is already over?
    options:
      - Because the point is the effort you put in, and it explains what you can do.
      - Because reading is a state verb, and state verbs ask for the continuous.
      - Because it happened very recently, and recent actions take the continuous.
      - Because the docs are long, and long tasks take the continuous in any tense.
    answer: 0
    rule: The continuous can explain a present ability or state that came from the activity, even once it stops.
    explain_es:
      rule: El continuo sirve para explicar de dónde viene algo que pasa ahora, aunque la actividad ya se haya frenado.
      analogy: Es el "estuve leyendo, por eso ahora te lo puedo contar". La lectura explica tu estado actual.
      why: Lo que importa es el tiempo que le metiste, que es lo que te habilita a explicar el flujo. "Read" no es verbo de estado y la duración no depende del largo del texto.

  - id: pp-cont-12
    type: fix_error
    difficulty: 3
    placement: false
    context: Retro.
    text: The tests have been fail intermittently since Monday.
    wrong: fail
    corrections: [failing]
    rule: After have been, the verb always takes -ing, even when the sentence already has two auxiliaries.
    explain_es:
      rule: Después de have been el verbo va con -ing, siempre. Los dos auxiliares no te eximen de la forma.
      analogy: Es una cadena de tres eslabones fijos. Si le sacás el -ing al último, la cadena se corta.
      why: Queda "The tests have been failing intermittently since Monday", que dice que el problema sigue pasando.

  - id: pp-cont-13
    type: cloze
    difficulty: 1
    placement: false
    context: Standup.
    text: I've ___ (be) reviewing PRs all morning.
    answers: [been]
    rule: The structure is have plus been plus the -ing form; been never changes.
    explain_es:
      rule: La estructura es have + been + verbo con -ing. El "been" es fijo y no cambia nunca.
      analogy: Es el enchufe del medio. Sin él, el have y el -ing no conectan.
      why: '"Be" acá va en participio, que es "been". Queda "I''ve been reviewing PRs all morning".'
