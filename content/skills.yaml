    slug: cimiento
    name: Cimiento
    topic_en: Placement
    topic_es: Diagnóstico

  - id: 1
    slug: pilar
    name: Pilar
    topic_en: Verb tenses
    topic_es: Tiempos verbales
    pieces:
      - id: "1.1"
        name_en: Present
        name_es: Presente
        skills:
          - id: tense.present.simple_vs_continuous
            name_en: Present simple vs present continuous
            name_es: Presente simple vs continuo
          - id: tense.present.stative_verbs
            name_en: Stative verbs
            name_es: Verbos de estado
      - id: "1.2"
        name_en: Past
        name_es: Pasado
        skills:
          - id: tense.past.simple_vs_continuous
            name_en: Past simple vs past continuous
            name_es: Pasado simple vs continuo
          - id: tense.past.used_to
            name_en: Used to / would
            name_es: Used to / would
      - id: "1.3"
        name_en: Present perfect
        name_es: Present perfect
        skills:
          - id: tense.present_perfect.result_experience
            name_en: Present perfect for results and experience
            name_es: Present perfect para resultados y experiencia
          - id: tense.present_perfect.just_already_yet
            name_en: Just, already, yet, ever
            name_es: Just, already, yet, ever
      - id: "1.4"
        name_en: Perfect vs past simple
        name_es: Perfect vs pasado simple
        skills:
          - id: tense.perfect_vs_past.finished_time
            name_en: Finished time vs open time
            name_es: Tiempo terminado vs tiempo abierto
          - id: tense.perfect_vs_past.for_since_ago
            name_en: For, since, ago
            name_es: For, since, ago
      - id: "1.5"
        name_en: Perfect continuous
        name_es: Perfect continuous
        skills:
          - id: tense.perfect_continuous.duration
            name_en: Duration up to now
            name_es: Duración hasta ahora
      - id: "1.6"
        name_en: Past perfect
        name_es: Past perfect
        skills:
          - id: tense.past_perfect.sequence
            name_en: The earlier past
            name_es: El pasado anterior
      - id: "1.7"
        name_en: Futures
        name_es: Futuros
        skills:
          - id: tense.future.will_vs_going_to
            name_en: Will vs going to
            name_es: Will vs going to
          - id: tense.future.present_for_future
            name_en: Present tenses for the future
            name_es: Presentes con valor de futuro
      - id: "1.8"
        name_en: Advanced future
        name_es: Futuro avanzado
        skills:
          - id: tense.future.perfect_and_continuous
            name_en: Future perfect and future continuous
            name_es: Future perfect y future continuous

