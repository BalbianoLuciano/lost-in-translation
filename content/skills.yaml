# Mapa de habilidades: obras → piezas → habilidades (PLAN.md §4, design.md §3).
# Cada ejercicio se etiqueta con UNA habilidad de acá.
# Las obras 3 a 6 se completan cuando se escribe su contenido; en F1 están las
# habilidades que mide el test de ubicación.

obras:
