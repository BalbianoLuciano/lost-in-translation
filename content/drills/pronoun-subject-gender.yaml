# Drills orales de referencia: marcan el nivel de calidad del resto.
#
# La idea (PLAN.md §5.3): el he/she no se arregla estudiando, se arregla
# automatizando bajo presión de tiempo. Por eso cada drill:
#   - da un contexto con personas de género explícito,
#   - pide hablar contra reloj,
#   - y declara qué pronombres tenés que usar y cuáles delatan el error.
#
# Como la app SABE qué corresponde, la corrección no depende de que la
# transcripción salga perfecta: Whisper a veces "corrige" la gramática.
skill: pronoun.subject_gender
drills:
  - id: drill-sofia-standup
    kind: pronouns
    seconds: 25
    context: Standup. Sofía, your QA lead, found a bug in checkout yesterday and is testing the fix today.
    prompt_en: Tell the team what Sofía did yesterday and what she is doing today.
    expect: [she]
    avoid: [he]
    hint_es: 'Hablá de Sofía en tercera persona todo el tiempo: "she found…", "she''s testing…".'

  - id: drill-diego-standup
    kind: pronouns
    seconds: 25
    context: Standup. Diego finished the migration last night and is on call today.
    prompt_en: Tell the team what Diego did last night and what he is doing today.
    expect: [he]
    avoid: [she]
    hint_es: 'Es Diego, así que va "he". Si te sale "she", frená y repetí la oración entera.'

  - id: drill-sofia-diego-compare
    kind: pronouns
    seconds: 35
    context: Sprint review. Sofía tested the checkout flow. Diego deployed the fix. The client thanked both.
    prompt_en: Say what each of them did in the sprint, one after the other.
    expect: [she, he]
    avoid: []
    hint_es: >-
      Este es el que importa: dos personas de distinto género en la misma
      respuesta. Decí primero lo de Sofía y después lo de Diego, sin apurarte.

  - id: drill-laptop-owner
    kind: pronouns
    seconds: 30
    context: Tomás built the dashboard on his laptop. Julia is reviewing it on hers.
    prompt_en: Explain whose laptop each person is using and what they are doing with it.
    expect: [his, her]
    avoid: []
    hint_es: >-
      El posesivo se elige por el dueño, no por la cosa: "his laptop" es la de
      Tomás y "her laptop" la de Julia. Es el calco de "su" que más se escucha.

  - id: drill-new-hire
    kind: pronouns
    seconds: 30
    context: A new hire starts on Monday. Nobody told you their name or anything about them.
    prompt_en: Say what the new hire will do in their first week, without guessing their gender.
    expect: [they, their]
    avoid: [he, she, his, her]
    hint_es: >-
      Cuando no sabés el género, en inglés va "they" en singular: "they start on
      Monday", "their laptop". Es lo normal en un equipo, no un rodeo.

  - id: drill-client-call
    kind: pronouns
    seconds: 40
    context: >-
      Client call. Marta is the product owner and asked for the report. Andrés is
      her developer and will build it. You are the lead.
    prompt_en: Summarize what Marta asked for, what Andrés will build, and what you will do next.
    expect: [she, he]
    avoid: []
    hint_es: >-
      Tres personas y vos. Marta es "she", Andrés es "he" y vos sos "I". Es la
      situación real donde más se te mezcla: hablando con un cliente.

  - id: drill-free-yesterday
    kind: free
    seconds: 45
    context: Anything you did at work yesterday.
    prompt_en: Tell me what you worked on yesterday and what you'll do today.
    hint_es: >-
      Sin consigna de pronombres: hablá suelto. Se transcribe y se te marcan los
      errores que aparezcan, incluidos los de he/she.
