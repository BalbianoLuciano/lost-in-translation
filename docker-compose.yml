# Postgres local para desarrollo y tests de integración.
# Puerto 54329 para no chocar con un Postgres instalado en la máquina.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lit
      POSTGRES_PASSWORD: lit
      POSTGRES_DB: lit
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lit -d lit"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
